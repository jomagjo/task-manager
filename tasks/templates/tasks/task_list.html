{% extends "base.html" %} {% block content %}
<h1>Tasks</h1>
<a class="btn" href="{% url 'task_add' %}">+ Add Task</a>

<table>
  <thead>
    <tr>
      <th>Title</th>
      <th>Description</th>
      <th>Due Date</th>
      <th>Status</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for task in tasks %}
    <tr>
      <td>{{ task.title }}</td>
      <td>{{ task.description }}</td>
      <td>{{ task.due_date }}</td>
      <td>
        <span class="status status-{{ task.status }}"
          >{{ task.get_status_display }}</span
        >
      </td>
      <td>
        <a href="{% url 'task_edit' task.pk %}">Edit</a>
        &nbsp;|&nbsp;
        <a href="{% url 'task_delete' task.pk %}">Delete</a>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="5">No tasks yet.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
