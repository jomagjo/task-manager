{% extends "base.html" %} {% block content %}
<h1>Delete Task</h1>
<p>Are you sure you want to delete "{{ task.title }}"?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn" type="submit">Yes, delete</button>
</form>
<p>
  <a href="{% url 'tasklist_detail' task_list_obj.pk %}"
    >&larr; Back to {{ task_list_obj.name }}</a
  >
</p>
{% endblock %}
