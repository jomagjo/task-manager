<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Task Manager</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
      h1 {
        margin-bottom: 24px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 16px;
      }
      th,
      td {
        text-align: left;
        padding: 8px;
        border-bottom: 1px solid #ddd;
      }
      .description-summary {
        cursor: pointer;
        display: flex;
        align-items: baseline;
        gap: 4px;
        max-width: 100%;
        list-style: none;
      }
      .description-summary::-webkit-details-marker {
        display: none;
      }
      .description-summary::marker {
        content: "";
      }
      .description-preview {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .expand-indicator {
        flex-shrink: 0;
        color: #5bc0de;
        font-size: 0.85em;
      }
      .description-full {
        margin-top: 6px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .status {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 4px;
        font-size: 0.85em;
        white-space: nowrap;
      }
      .status-pending {
        background: #f0ad4e;
        color: #fff;
      }
      .status-in_progress {
        background: #5bc0de;
        color: #fff;
      }
      .status-completed {
        background: #5cb85c;
        color: #fff;
      }
      .btn {
        display: inline-block;
        padding: 8px 16px;
        background: #333;
        color: #fff;
        text-decoration: none;
        border-radius: 4px;
      }
      form p {
        margin-bottom: 12px;
      }
      label {
        display: block;
        margin-bottom: 4px;
        font-weight: bold;
      }
      input,
      textarea,
      select {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
      }
      .field-with-mic {
        display: flex;
        gap: 8px;
        align-items: flex-start;
      }
      .field-with-mic input,
      .field-with-mic textarea {
        flex: 1;
        min-width: 0;
      }
      .mic-btn {
        flex-shrink: 0;
        padding: 6px 10px;
        border: none;
        border-radius: 4px;
        background: #5bc0de;
        color: #fff;
        cursor: pointer;
        font-size: 1rem;
        line-height: 1.4;
      }
      .mic-btn.listening {
        background: #d9534f;
      }
      .mic-btn:disabled {
        background: #ccc;
        cursor: not-allowed;
      }
      .navbar {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid #ddd;
        margin-bottom: 16px;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="navbar">
      {% if user.is_authenticated %}
      <span>Logged in as <strong>{{ user.username }}</strong></span>
      <form method="post" action="{% url 'logout' %}" style="margin: 0">
        {% csrf_token %}
        <button type="submit" class="btn" style="padding: 2px 10px">
          Log Out
        </button>
      </form>
      {% else %}
      <a href="{% url 'login' %}">Log In</a>
      <a href="{% url 'signup' %}">Sign Up</a>
      {% endif %}
    </div>
    {% block content %}{% endblock %}
  </body>
</html>
